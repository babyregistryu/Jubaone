<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Article — JubaOne</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header"><div class="wrap"><h1><a href="index.html" style="color:#fff;text-decoration:none">JubaOne</a></h1></div></header>
  <main class="wrap">
    <div id="article-container"></div>
    <a href="index.html">← Back to home</a>
  </main>
  <script>
    async function loadArticle(){
      try{
        const resp = await fetch('data/initial_data.json');
        if(!resp.ok) throw new Error('Failed to load data');
        const seed = await resp.json();
        const slug = new URLSearchParams(location.search).get('slug');
        const a = seed.articles.find(x => x.slug === slug);
        const container = document.getElementById('article-container');
        if(!a){ container.innerHTML = '<p>Article not found.</p>'; }
        else{
          container.innerHTML = `<article><h2>${a.title}</h2><p class="meta">By ${a.author} • ${a.date}</p><div class="content">${a.content}</div></article>`;
        }
      }catch(err){
        console.error(err);
        document.getElementById('article-container').innerHTML = '<p style="color:#c00">Unable to load article. If you are opening files locally (file://) use a local HTTP server.</p>';
      }
    }
    loadArticle();
  </script>
</body>
</html>
